<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — Complete Intro to Vue 3</title>
  </head>
  <body>
    <h1>Hello World!</h1>
    <div id="app">
      <p v-if="message.length % 2 === 0">{{message.toUpperCase()}}</p>
      <p v-else>{{oddMessage}}</p>
      <ul>
        <li v-for="item in list">{{item * Math.PI}}</li>
      </ul>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script setup>
      //similar to Vue.createApp
      const { createApp } = Vue;
      const app = createApp({
        //best practice to have data be a function to avoid stale values
        data() {
          return {
            message: "Howdy!",
            oddMessage: "Boooo!",
            list: [1, 2, 3, 4, 5],
          };
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
